<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f1a"/><stop offset="1" stop-color="#0c0710"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b81"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- heart -->
  <g transform="translate(440 380)">
    <path d="M0 -110 C-50 -200 -230 -190 -230 -40 C-230 70 -100 150 0 240 C100 150 230 70 230 -40 C230 -190 50 -200 0 -110 Z" fill="#e11d48" opacity=".45" filter="url(#glow)"/>
    <path d="M0 -110 C-50 -200 -230 -190 -230 -40 C-230 70 -100 150 0 240 C100 150 230 70 230 -40 C230 -190 50 -200 0 -110 Z" fill="url(#heart)"/>
    <path d="M-190 20 H-90 l28 -60 l36 140 l40 -190 l34 150 l22 -40 H190" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- SHAP-style feature importance -->
  <g transform="translate(860 150)" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#fda4af">
    <text x="0" y="0" font-size="26" letter-spacing="6" fill="#fb7185">FEATURE IMPACT</text>
    <path d="M300 40 V470" stroke="#ffffff" stroke-opacity=".25" stroke-width="3"/>
    <g>
      <rect x="0" y="75" width="200" height="14" rx="7" fill="#ffffff" fill-opacity=".18"/><rect x="300" y="64" width="330" height="40" rx="8" fill="#fb7185"/>
      <rect x="0" y="155" width="150" height="14" rx="7" fill="#ffffff" fill-opacity=".18"/><rect x="300" y="144" width="260" height="40" rx="8" fill="#fb7185"/>
      <rect x="0" y="235" width="120" height="14" rx="7" fill="#ffffff" fill-opacity=".18"/><rect x="300" y="224" width="210" height="40" rx="8" fill="#fb7185"/>
      <rect x="0" y="315" width="120" height="14" rx="7" fill="#ffffff" fill-opacity=".18"/><rect x="160" y="304" width="140" height="40" rx="8" fill="#60a5fa"/>
      <rect x="0" y="395" width="140" height="14" rx="7" fill="#ffffff" fill-opacity=".18"/><rect x="300" y="384" width="120" height="40" rx="8" fill="#fb7185"/>
    </g>
  </g>
  <text x="100" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" fill="#fff">Heart Disease <tspan fill="#fb7185">Prediction</tspan></text>
  <text x="104" y="870" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#fda4af" letter-spacing="8">MACHINE LEARNING · EXPLAINABLE AI (SHAP)</text>
</svg>
